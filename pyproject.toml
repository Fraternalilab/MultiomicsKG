[tool.poetry]
name = "multiomicskg"
version = "1.0.0"
description = "Multi-omics Knowledge Graph for SNVs and their effects on protein structure and function with an agentic chatbot interface"
authors = [
    "Julian Herrera Braga <julian.braga.22@ucl.ac.uk>, Joseph Ng <joseph.ng@ucl.ac.uk>, Franca Fraternali <f.fraternali@ucl.ac.uk>",
]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
pandas = "^2.0.1"
py2neo = "^2021.2.3"
ipykernel = "^6.22.0"
networkx = "^3.1"
matplotlib = "^3.7.1"
keras = "^2.12.0"
rpy2 = "^3.5.12"
biopython = "^1.81"
scikit-learn = "^1.2.2"
neo4j = "^5.10.0"
numpy = "<1.27"
pytest = "^7.4.3"
seaborn = "^0.13.2"
shap = "^0.45.1"
notebook = "^7.2.0"
xgboost = "^2.0.3"
langchain = "^0.3.13"
langchain-community = "^0.3.13"
openai = "^1.58.1"
tiktoken = "^0.8.0"
neo4j-graphrag = { extras = ["ollama"], version = "^1.6.1" }
openpyxl = "^3.1.5"
langchain-neo4j = "^0.4.0"
langchain-ollama = "^0.3.3"
langchain-core = "^0.3.65"
langgraph = "^0.4.8"
langchain-openai = "^0.3.25"
uvicorn = "^0.35.0"
fastapi = "^0.116.0"
passlib = "^1.7.4"
jwt = "^1.4.0"
python-multipart = "^0.0.20"
aiohttp = "^3.12.13"
statsmodels = "^0.14.5"
langchain-anthropic = "^0.3.22"
neo4j-mcp-server = "^1.6.0"

[tool.poetry.group.dev.dependencies]
#flake8 = "^3.9.2"
black = { version = "^21.9b0", allow-prereleases = true }
flake8 = "^6.1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
